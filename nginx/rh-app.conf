# =============================================================================
# nginx/rh-app.conf — Reverse proxy Nginx pour l'application RH
#
# PRÉREQUIS :
#   - Nginx installé sur le serveur
#   - Certificat Let's Encrypt : certbot --nginx -d votre-domaine.com
#   - Pare-feu : autoriser 80 et 443 uniquement
#     (l'application écoute sur 127.0.0.1:8222 — non exposée directement)
#
# INSTALLATION :
#   sudo cp nginx/rh-app.conf /etc/nginx/sites-available/rh-app
#   sudo ln -s /etc/nginx/sites-available/rh-app /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

# Redirection HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name votre-domaine.com;

    # Let's Encrypt challenge (certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Serveur HTTPS principal
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name votre-domaine.com;

    # ── Certificat Let's Encrypt (généré par certbot) ──────────────────────────
    ssl_certificate     /etc/letsencrypt/live/votre-domaine.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/votre-domaine.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── En-têtes de sécurité ───────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options           SAMEORIGIN                            always;
    add_header X-Content-Type-Options    nosniff                               always;
    add_header Referrer-Policy           strict-origin-when-cross-origin       always;

    # ── Bloquer l'accès à la console H2 (sécurité défense en profondeur) ──────
    location /h2-console {
        return 403;
    }

    # ── Proxy vers l'application Spring Boot ──────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:8222;
        proxy_http_version 1.1;

        # En-têtes transmis à Spring Boot
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Port  $server_port;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Buffers
        proxy_buffer_size   16k;
        proxy_buffers       4 32k;
    }

    # ── Logs ──────────────────────────────────────────────────────────────────
    access_log /var/log/nginx/rh-app-access.log;
    error_log  /var/log/nginx/rh-app-error.log;
}
