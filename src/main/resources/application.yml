# =============================================================================
# application.yml — Configuration commune à tous les profils
# Les valeurs spécifiques dev/prod sont dans application-dev.yml
# et application-prod.yml.
# =============================================================================

spring:
  application:
    name: rh-application

  # Profil actif : dev par défaut, surchargeable par la variable d'env
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # Thymeleaf
  thymeleaf:
    encoding: UTF-8
    mode: HTML

  # JPA — open-in-view désactivé (évite les requêtes implicites lors du rendu)
  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.H2Dialect

  # H2 — chemin de la console (activé/désactivé par profil)
  h2:
    console:
      path: /h2-console

  # Données
  sql:
    init:
      encoding: UTF-8

# =============================================================================
# Serveur
# =============================================================================
server:
  port: ${PORT:8222}
  servlet:
    encoding:
      charset: UTF-8
      force: true
      force-request: true
      force-response: true
