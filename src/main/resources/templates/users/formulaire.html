<!DOCTYPE html>
<html th:replace="~{layout/base :: page(
        titre=${modeCreation} ? 'Nouvel utilisateur' : 'Modifier l\'utilisateur',
        contenu=~{::main})}"
      xmlns:th="http://www.thymeleaf.org">
<body>
<main>

    <div class="card shadow-sm" style="max-width:600px;">
        <div class="card-body">

            <form th:action="${modeCreation}
                              ? @{/users}
                              : @{/users/{id}(id=${userForm.id})}"
                  th:object="${userForm}"
                  method="post" novalidate>

                <!-- Nom d'utilisateur -->
                <div class="mb-3">
                    <label for="username" class="form-label fw-semibold">
                        Nom d'utilisateur <span class="text-danger">*</span>
                    </label>
                    <input type="text" id="username" th:field="*{username}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'"
                           placeholder="3 à 50 caractères" autofocus>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('username')}">
                        <span th:errors="*{username}"></span>
                    </div>
                </div>

                <!-- Email -->
                <div class="mb-3">
                    <label for="email" class="form-label fw-semibold">
                        Email <span class="text-danger">*</span>
                    </label>
                    <input type="email" id="email" th:field="*{email}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                           placeholder="votre@email.com">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}">
                        <span th:errors="*{email}"></span>
                    </div>
                </div>

                <!-- Mot de passe -->
                <div class="mb-3">
                    <label for="password" class="form-label fw-semibold">
                        Mot de passe
                        <span th:if="${modeCreation}" class="text-danger">*</span>
                        <small th:unless="${modeCreation}"
                               class="text-muted fw-normal">(laisser vide pour conserver)</small>
                    </label>
                    <input type="password" id="password" th:field="*{password}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                           placeholder="Au moins 8 caractères">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}">
                        <span th:errors="*{password}"></span>
                    </div>
                </div>

                <!-- Confirmation -->
                <div class="mb-3">
                    <label for="confirmPassword" class="form-label fw-semibold">Confirmation</label>
                    <input type="password" id="confirmPassword" th:field="*{confirmPassword}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'"
                           placeholder="Répéter le mot de passe">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('confirmPassword')}">
                        <span th:errors="*{confirmPassword}"></span>
                    </div>
                </div>

                <!-- Rôles -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">Rôles</label>
                    <div th:each="role : ${roles}" class="form-check">
                        <input class="form-check-input" type="checkbox"
                               th:id="${'role_' + role.id}"
                               name="roleIds"
                               th:value="${role.id}"
                               th:checked="${userForm.roleIds != null
                                   and userForm.roleIds.contains(role.id)}">
                        <label class="form-check-label"
                               th:for="${'role_' + role.id}"
                               th:text="${role.name}">ROLE</label>
                    </div>
                </div>

                <!-- Statut actif -->
                <div class="mb-4 form-check form-switch">
                    <input class="form-check-input" type="checkbox"
                           id="enabled" th:field="*{enabled}" role="switch">
                    <label class="form-check-label" for="enabled">Compte actif</label>
                </div>

                <!-- Boutons -->
                <div class="d-flex gap-2">
                    <button type="submit" class="btn"
                            th:classappend="${modeCreation} ? 'btn-primary' : 'btn-warning'">
                        <i class="bi bi-save me-1"></i>
                        <span th:text="${modeCreation} ? 'Créer' : 'Enregistrer'">Enregistrer</span>
                    </button>
                    <a th:href="@{/users}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left me-1"></i>Annuler
                    </a>
                </div>

            </form>
        </div>
    </div>

</main>
</body>
</html>
