<!DOCTYPE html>
<html th:replace="~{layout/base :: page(titre='Gestion des utilisateurs', contenu=~{::main})}"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<main>

    <!-- Barre de recherche + bouton Nouveau -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <form th:action="@{/users}" method="get" class="d-flex gap-2">
            <input type="text" name="motCle" th:value="${motCle}"
                   class="form-control form-control-sm"
                   placeholder="Rechercher…" style="max-width:280px">
            <button class="btn btn-sm btn-outline-secondary" type="submit">
                <i class="bi bi-search"></i>
            </button>
            <a th:href="@{/users}" class="btn btn-sm btn-outline-danger"
               th:if="${motCle != null and !motCle.isEmpty()}">
                <i class="bi bi-x-lg"></i>
            </a>
        </form>
        <a th:href="@{/users/nouveau}" class="btn btn-primary btn-sm">
            <i class="bi bi-plus-circle me-1"></i>Nouveau
        </a>
    </div>

    <!-- Tableau -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover table-striped mb-0 align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>Utilisateur</th>
                        <th>Email</th>
                        <th>Rôles</th>
                        <th class="text-center">Statut</th>
                        <th class="text-end">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${users.isEmpty()}">
                        <td colspan="5" class="text-center text-muted py-4">
                            <i class="bi bi-inbox fs-4 d-block mb-1"></i>Aucun utilisateur.
                        </td>
                    </tr>
                    <tr th:each="u : ${users}">
                        <td>
                            <i class="bi bi-person-circle me-1 text-secondary"></i>
                            <span th:text="${u.username}">user</span>
                        </td>
                        <td th:text="${u.email}">email</td>
                        <td>
                            <span th:each="r : ${u.roles}"
                                  class="badge me-1"
                                  th:classappend="${r.name == 'ROLE_ADMIN'} ? 'bg-danger' : 'bg-primary'"
                                  th:text="${r.name}">ROLE</span>
                        </td>
                        <td class="text-center">
                            <span th:if="${u.enabled}"  class="badge bg-success">Actif</span>
                            <span th:unless="${u.enabled}" class="badge bg-secondary">Désactivé</span>
                        </td>
                        <td class="text-end">
                            <a th:href="@{/users/{id}/modifier(id=${u.id})}"
                               class="btn btn-sm btn-outline-primary me-1" title="Modifier">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <a th:href="@{/users/{id}/reset-password(id=${u.id})}"
                               class="btn btn-sm btn-outline-warning me-1"
                               title="Réinitialiser mot de passe">
                                <i class="bi bi-key"></i>
                            </a>
                            <button type="button" class="btn btn-sm btn-outline-danger"
                                    data-bs-toggle="modal"
                                    data-bs-target="#modalSupprimer"
                                    th:attr="data-id=${u.id}, data-username=${u.username}"
                                    title="Supprimer">
                                <i class="bi bi-trash"></i>
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        <div class="card-footer d-flex flex-wrap justify-content-between align-items-center gap-2"
             th:if="${users.totalPages > 0}">
            <small class="text-muted">
                Page <strong th:text="${users.number + 1}">1</strong>
                sur <strong th:text="${users.totalPages}">1</strong>
                — <span th:text="${users.totalElements}">0</span> résultat(s)
            </small>
            <nav>
                <ul class="pagination pagination-sm mb-0">
                    <li class="page-item" th:classappend="${users.first} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/users(motCle=${motCle},page=${users.number-1},taille=${taille})}">&laquo;</a>
                    </li>
                    <li th:each="i : ${#numbers.sequence(0, users.totalPages - 1)}"
                        class="page-item"
                        th:classappend="${i == users.number} ? 'active'">
                        <a class="page-link"
                           th:href="@{/users(motCle=${motCle},page=${i},taille=${taille})}"
                           th:text="${i + 1}">1</a>
                    </li>
                    <li class="page-item" th:classappend="${users.last} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/users(motCle=${motCle},page=${users.number+1},taille=${taille})}">&raquo;</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>

    <!-- Modale de confirmation suppression -->
    <div class="modal fade" id="modalSupprimer" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>Confirmer la suppression
                    </h5>
                    <button type="button" class="btn-close btn-close-white"
                            data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    Supprimer l'utilisateur
                    <strong id="usernameASupprimer" class="text-danger"></strong> ?
                    <br><small class="text-muted">Cette action est irréversible.</small>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary"
                            data-bs-dismiss="modal">Annuler</button>
                    <form id="formSupprimer" method="post">
                        <button type="submit" class="btn btn-danger">Supprimer</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('modalSupprimer').addEventListener('show.bs.modal', function (e) {
            var btn = e.relatedTarget;
            document.getElementById('usernameASupprimer').textContent =
                btn.getAttribute('data-username');
            document.getElementById('formSupprimer').action =
                '/users/' + btn.getAttribute('data-id') + '/supprimer';
        });
    </script>

</main>
</body>
</html>
