<!DOCTYPE html>
<html th:replace="~{layout/base :: page(titre='Réinitialiser le mot de passe', contenu=~{::main})}"
      xmlns:th="http://www.thymeleaf.org">
<body>
<main>

    <div class="card shadow-sm" style="max-width:450px;">
        <div class="card-body">

            <div th:if="${erreurPwd}" class="alert alert-danger py-2">
                <i class="bi bi-exclamation-triangle me-1"></i>
                <span th:text="${erreurPwd}"></span>
            </div>

            <form th:action="@{/users/{id}/reset-password(id=${userId})}"
                  method="post" novalidate>

                <div class="mb-3">
                    <label for="nouveauMotDePasse" class="form-label fw-semibold">
                        Nouveau mot de passe <span class="text-danger">*</span>
                    </label>
                    <input type="password" id="nouveauMotDePasse"
                           name="nouveauMotDePasse"
                           class="form-control"
                           placeholder="Au moins 8 caractères"
                           autofocus required>
                </div>

                <div class="mb-4">
                    <label for="confirmMotDePasse" class="form-label fw-semibold">
                        Confirmation <span class="text-danger">*</span>
                    </label>
                    <input type="password" id="confirmMotDePasse"
                           name="confirmMotDePasse"
                           class="form-control"
                           placeholder="Répéter le mot de passe" required>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-warning">
                        <i class="bi bi-key me-1"></i>Réinitialiser
                    </button>
                    <a th:href="@{/users}" class="btn btn-outline-secondary">Annuler</a>
                </div>
            </form>
        </div>
    </div>

</main>
</body>
</html>
