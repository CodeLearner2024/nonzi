<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Connexion — RH Application</title>

    <!-- Bootstrap 5 local (WebJar) -->
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <!-- Bootstrap Icons local (WebJar) -->
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.css}">

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1e2a38 0%, #0d6efd 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            border-radius: 1rem;
            box-shadow: 0 1rem 3rem rgba(0, 0, 0, 0.35);
        }
    </style>
</head>

<body>

<div class="login-card card border-0 p-4">

    <!-- En-tête -->
    <div class="text-center mb-4">
        <i class="bi bi-people-fill text-primary" style="font-size: 2.5rem;"></i>
        <h1 class="h4 mt-2 fw-bold">RH Application</h1>
        <p class="text-muted small mb-0">Connectez-vous pour continuer</p>
    </div>

    <!-- Message succès après inscription -->
    <div th:if="${param.registered}" class="alert alert-success alert-dismissible fade show py-2" role="alert">
        <i class="bi bi-check-circle me-1"></i>Inscription réussie ! Vous pouvez vous connecter.
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fermer"></button>
    </div>

    <!-- Erreur d'authentification — message générique (ne révèle pas si le compte existe) -->
    <div th:if="${param.error}" class="alert alert-danger py-2" role="alert">
        <i class="bi bi-exclamation-triangle me-1"></i>Identifiants incorrects. Veuillez réessayer.
    </div>

    <!-- Message de déconnexion -->
    <div th:if="${param.logout}" class="alert alert-info py-2" role="alert">
        <i class="bi bi-info-circle me-1"></i>Vous avez été déconnecté.
    </div>

    <!-- Formulaire — l'action /login est traitée par Spring Security -->
    <form th:action="@{/login}" method="post" novalidate>
        <!-- Jeton CSRF automatiquement injecté par Thymeleaf + Spring Security -->

        <div class="mb-3">
            <label for="username" class="form-label fw-semibold">Nom d'utilisateur</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-person"></i></span>
                <input type="text"
                       id="username"
                       name="username"
                       class="form-control"
                       placeholder="Votre identifiant"
                       autocomplete="username"
                       autofocus
                       required>
            </div>
        </div>

        <div class="mb-4">
            <label for="password" class="form-label fw-semibold">Mot de passe</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="password"
                       id="password"
                       name="password"
                       class="form-control"
                       placeholder="Votre mot de passe"
                       autocomplete="current-password"
                       required>
            </div>
        </div>

        <div class="d-grid">
            <button type="submit" class="btn btn-primary btn-lg">
                <i class="bi bi-box-arrow-in-right me-2"></i>Se connecter
            </button>
        </div>
    </form>

    <hr class="my-3">

    <p class="text-center text-muted small mb-0">
        Pas encore de compte ?
        <a th:href="@{/register}" class="text-decoration-none fw-semibold">S'inscrire</a>
    </p>
</div>

<!-- Bootstrap JS Bundle local (WebJar) -->
<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
