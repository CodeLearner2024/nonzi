<!DOCTYPE html>
<html th:replace="~{layout/base :: page(titre='Tableau de bord', contenu=~{::main})}"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<main>

    <!-- Bannière de bienvenue -->
    <div class="card border-0 shadow-sm mb-4"
         style="background: linear-gradient(135deg,#1e2a38,#0d6efd); color:#fff;">
        <div class="card-body d-flex align-items-center gap-3 py-4 px-4">
            <i class="bi bi-person-circle" style="font-size:2.5rem; opacity:0.85;"></i>
            <div>
                <h2 class="h5 mb-1 fw-semibold">
                    Bienvenue,&nbsp;<span th:text="${nomUtilisateur}">utilisateur</span>&nbsp;!
                </h2>
                <p class="mb-0 small" style="opacity:0.8;">
                    Vous êtes connecté à l'application RH.
                    <span sec:authorize="hasRole('ADMIN')">
                        Vous avez les droits d'administration.
                    </span>
                </p>
            </div>
        </div>
    </div>

    <!-- Accès rapide -->
    <h2 class="h6 text-muted text-uppercase fw-semibold mb-3"
        style="letter-spacing:.05em;">Accès rapide</h2>

    <div class="row g-3">

        <!-- Types de personne -->
        <div class="col-sm-6 col-lg-4">
            <a th:href="@{/types-personne}"
               class="dashboard-card card border-0 shadow-sm h-100 d-block">
                <div class="card-body text-center py-4">
                    <i class="bi bi-tags card-icon text-primary"></i>
                    <h6 class="card-title fw-semibold mb-1">Types de personne</h6>
                    <p class="card-text text-muted small mb-3">Gérer les types (EMP, STG, CTR…)</p>
                    <span class="btn btn-sm btn-outline-primary">Gérer</span>
                </div>
            </a>
        </div>

        <!-- Utilisateurs — ADMIN uniquement -->
        <div class="col-sm-6 col-lg-4" sec:authorize="hasRole('ADMIN')">
            <a th:href="@{/users}"
               class="dashboard-card card border-0 shadow-sm h-100 d-block">
                <div class="card-body text-center py-4">
                    <i class="bi bi-people card-icon text-success"></i>
                    <h6 class="card-title fw-semibold mb-1">Utilisateurs</h6>
                    <p class="card-text text-muted small mb-3">Gérer les comptes utilisateurs</p>
                    <span class="btn btn-sm btn-outline-success">Gérer</span>
                </div>
            </a>
        </div>

        <!-- ➕ Les prochains modules apparaîtront ici -->

    </div>

</main>
</body>
</html>
