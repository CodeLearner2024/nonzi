# =============================================================================
# application-prod.yml — Profil production
# Activé par : SPRING_PROFILES_ACTIVE=prod
# TOUTES les variables ${...} sans défaut DOIVENT être définies dans .env.
# =============================================================================

spring:
  datasource:
    # Fichier H2 persistant sur volume /data (Render Disk ou Docker volume).
    # H2_PATH : chemin sans extension, ex: /data/rhdb → crée /data/rhdb.mv.db
    # AUTO_SERVER=FALSE : une seule instance autorisée.
    url: jdbc:h2:file:${H2_PATH:/data/rhdb};AUTO_SERVER=FALSE;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=USER
    driver-class-name: org.h2.Driver
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}

  h2:
    console:
      enabled: false              # Console inaccessible en production

  jpa:
    hibernate:
      ddl-auto: update            # update en attendant Flyway bien configuré
    show-sql: false

  flyway:
    enabled: false                # Désactivé par défaut — activer après validation

  sql:
    init:
      mode: never

  thymeleaf:
    cache: true

# =============================================================================
# Serveur — arrêt propre + compression + sécurité des cookies
# =============================================================================
server:
  shutdown: graceful
  forward-headers-strategy: framework

  compression:
    enabled: true
    mime-types: text/html,text/css,application/javascript,application/json
    min-response-size: 1024

  servlet:
    session:
      cookie:
        secure: true
        http-only: true
        same-site: lax

  error:
    include-stacktrace: never
    include-message: never

# =============================================================================
# Arrêt propre Spring
# =============================================================================
spring.lifecycle:
  timeout-per-shutdown-phase: 30s

# =============================================================================
# Actuator
# =============================================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

# =============================================================================
# Logging
# =============================================================================
logging:
  level:
    root: INFO
    com.monentreprise.rh: INFO
