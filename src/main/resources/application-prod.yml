# =============================================================================
# application-prod.yml — Profil production
# Activé par : SPRING_PROFILES_ACTIVE=prod
# TOUTES les variables ${...} sans défaut DOIVENT être définies dans .env.
# =============================================================================

spring:
  datasource:
    # Fichier H2 persistant sur volume /data.
    # AUTO_SERVER=FALSE : une seule instance autorisée (pas de réplicas).
    url: jdbc:h2:file:${H2_PATH:/data/rhdb};AUTO_SERVER=FALSE;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=USER
    driver-class-name: org.h2.Driver
    username: ${DB_USERNAME}      # Pas de valeur par défaut — doit être défini
    password: ${DB_PASSWORD}      # Pas de valeur par défaut — doit être défini

  h2:
    console:
      enabled: false              # Console inaccessible en production

  jpa:
    hibernate:
      ddl-auto: validate          # Flyway gère le schéma ; Hibernate valide seulement
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    out-of-order: false

  sql:
    init:
      mode: never

  thymeleaf:
    cache: true

# =============================================================================
# Serveur — arrêt propre + compression + sécurité des cookies
# =============================================================================
server:
  shutdown: graceful              # Termine les requêtes en cours avant de s'arrêter
  forward-headers-strategy: framework  # Fait confiance aux en-têtes X-Forwarded-* du proxy

  compression:
    enabled: true
    mime-types: text/html,text/css,application/javascript,application/json
    min-response-size: 1024

  servlet:
    session:
      cookie:
        secure: true              # Cookie uniquement sur HTTPS
        http-only: true
        same-site: lax

  error:
    include-stacktrace: never     # Ne jamais exposer les stack traces
    include-message: never        # Ne jamais exposer les messages d'exception

# =============================================================================
# Arrêt propre Spring (flush H2 avant arrêt)
# =============================================================================
spring.lifecycle:
  timeout-per-shutdown-phase: 30s

# =============================================================================
# Actuator — seulement health et info exposés
# =============================================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

# =============================================================================
# Logging — fichier tournant, niveau INFO
# =============================================================================
logging:
  level:
    root: INFO
    com.monentreprise.rh: INFO
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 14
  file:
    name: /data/logs/rh-application.log
