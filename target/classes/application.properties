# ===================================================================
# APPLICATION RH - Configuration principale
# ===================================================================

spring.application.name=rh

# --- Encodage UTF-8 (servlet + SQL + Thymeleaf) ---
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.force-request=true
server.servlet.encoding.force-response=true
spring.thymeleaf.encoding=UTF-8
spring.sql.init.encoding=UTF-8

# --- Base de données H2 (dev) ---
spring.datasource.url=jdbc:h2:mem:rhdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=USER
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console H2 accessible sur http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA / Hibernate ---
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# update : conserve les données entre redémarrages (ne recrée pas le schéma)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# data.sql ne contient plus d'insertions — désactivé
spring.sql.init.mode=never

# --- Thymeleaf ---
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML

# --- Serveur ---
server.port=8080

# ===================================================================
# Sécurité — compte admin par défaut (à changer en production !)
# ===================================================================
app.security.admin-username=admin
app.security.admin-email=admin@rh.local
app.security.admin-password=Admin@1234

